<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Hoshmand Game WebKit v[[VERSION_PLACEHOLDER]] by Epinor (built [[BUILD_TIME_PLACEHOLDER]])</title>
</head>

<body>
  <!-- Background is requested only after the normal page load event. -->
  <div id="pageBackground" aria-hidden="true"></div>

  <div id="splash" aria-hidden="false">
    <img class="logo" src="logo.svg" alt="WebKit Autoloader" />
    <h1>Hoshmand Game WebKit</h1>
  </div>

  <!--
    IMPORTANT:
    Keep the exploit iframe OUTSIDE #loader.
    #loader is hidden until revealExploit() runs; the exploit must be able
    to navigate/execute independently of that visual UI state.
  -->
  <iframe id="exploit" title="exploit" hidden></iframe>

  <main id="loader" hidden>
    <div id="logWrapper">
      <div id="logContainer"></div>
    </div>

    <div id="progressContainer">
      <div id="progressBar"></div>
      <div id="progressLabel">Loading...</div>
    </div>
  </main>

  <footer id="footer">
    Hoshmand Game WebKit v[[VERSION_PLACEHOLDER]] by Epinor (built [[BUILD_TIME_PLACEHOLDER]])<br />
  </footer>

  <!--
    Only the background loader is added here.
    It does not alter app.js, the exploit URL, timing, sessionStorage,
    iframe, or progress logic.
  -->
  <script>
    window.addEventListener("load", function () {
      var bg = new Image();

      bg.onload = function () {
        var layer = document.getElementById("pageBackground");
        if (layer) {
          layer.style.backgroundImage = 'url("background.png")';
          layer.classList.add("loaded");
        }
      };

      bg.src = "background.png";
    }, false);
  </script>

  <script src="app.js"></script>
</body>

</html>
