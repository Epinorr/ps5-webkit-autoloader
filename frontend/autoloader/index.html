<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Hoshmand Game WebKit</title>
</head>

<body>

  <!--
    Background is intentionally NOT referenced by CSS.
    It is requested only after the page's normal load event, so the
    background can never delay the initial app/exploit startup.
  -->
  <div id="pageBackground" aria-hidden="true"></div>

  <div id="splash">
    <img class="logo" src="logo.svg" alt="">
    <h1>Hoshmand Game WebKit</h1>
  </div>

  <main id="loader">
    <iframe id="exploit" hidden></iframe>

    <div id="logWrapper">
      <div id="logContainer"></div>
    </div>

    <div id="progressContainer">
      <div id="progressBar"></div>
      <div id="progressLabel"></div>
    </div>
  </main>

  <footer id="footer">
    Hoshmand Game WebKit
  </footer>

  <!--
    This only schedules the background request.
    It does NOT wait for the image and does NOT touch app.js/exploit logic.
  -->
  <script>
    window.addEventListener("load", function () {
      var bg = new Image();

      bg.onload = function () {
        var layer = document.getElementById("pageBackground");
        if (layer) {
          layer.style.backgroundImage = 'url("background.png")';
          layer.classList.add("loaded");
        }
      };

      bg.src = "background.png";
    }, false);
  </script>

  <script src="app.js"></script>
</body>

</html>
