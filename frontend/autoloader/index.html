<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Hoshmand Game WebKit v[[VERSION_PLACEHOLDER]] by Epinor (built [[BUILD_TIME_PLACEHOLDER]])</title>
</head>

<body>
  <div id="pageBackground" aria-hidden="true"></div>

  <div id="splash" aria-hidden="false">
    <img class="logo" src="logo.svg" alt="WebKit Autoloader" />
    <h1>Hoshmand Game WebKit</h1>
  </div>

  <!-- MUST remain outside #loader: this is the exploit iframe. -->
  <iframe id="exploit" title="exploit" hidden></iframe>

  <main id="loader" hidden>
    <div id="logWrapper">
      <div id="logContainer"></div>
    </div>

    <div id="progressContainer">
      <div id="progressBar"></div>
      <div id="progressLabel">Loading...</div>
    </div>

    <!-- p2jb live statistics, mirrored from the exploit's #livestat readout
         by app.js. Hidden until the first real phase starts; styled in
         style.css (#p2jbStats / body.p2jb-stats). -->
    <div id="p2jbStats" hidden>
      <div class="stats-head">
        <span class="stats-title">P2JB</span>
        <span class="stats-chip" id="p2jbStepChip">STEP &ndash;/7</span>
        <span class="stats-clock" id="p2jbClocks">total --:--:--</span>
      </div>
      <div class="stats-status" id="p2jbStatus">&#8230;</div>
      <div class="stats-infoline">
        <div class="stats-detail" id="p2jbDetail" hidden></div>
        <div id="p2jbGroups" hidden></div>
      </div>
      <div class="stats-bar-row">
        <div class="stats-bar-label"><span id="p2jbPhaseName">PHASE</span><span id="p2jbPhasePct">&ndash;</span></div>
        <div class="stats-track"><div class="stats-fill" id="p2jbPhaseFill"></div></div>
        <div class="stats-meta" id="p2jbPhaseMeta">ETA --:--:--</div>
      </div>
      <div class="stats-bar-row overall">
        <div class="stats-bar-label"><span>OVERALL</span><span id="p2jbOverallPct">&ndash;</span></div>
        <div class="stats-track big"><div class="stats-fill" id="p2jbOverallFill"></div></div>
        <div class="stats-meta" id="p2jbOverallMeta">&ndash; left</div>
      </div>
    </div>
  </main>

  <footer id="footer">Hoshmand Game WebKit v[[VERSION_PLACEHOLDER]] by Epinor (built [[BUILD_TIME_PLACEHOLDER]])<br />This project is free and open source: github.com/itsPLK/ps5-webkit-autoloader</footer>

  <!-- IMPORTANT: app.js is loaded FIRST. Do not move this below the background loader. -->
  <script src="app.js"></script>

  <!--
    Background loader is registered AFTER app.js.
    The exploit therefore receives the window.load event first.
    The image request is additionally delayed to keep it out of the
    critical exploit-start window.
  -->
  <script>
    window.addEventListener("load", function () {
      window.setTimeout(function () {
        var bg = new Image();

        bg.onload = function () {
          var layer = document.getElementById("pageBackground");
          if (layer) {
            layer.style.backgroundImage = 'url("background.png")';
            layer.classList.add("loaded");
          }
        };

        bg.src = "background.png";
      }, 3000);
    }, false);
  </script>
</body>

</html>
